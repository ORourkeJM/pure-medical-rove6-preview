name: Publish design preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
        env:
          ROVE6_REQUEST_ENDPOINT: ${{ vars.ROVE6_REQUEST_ENDPOINT }}
          MARINE_GA4_MEASUREMENT_ID: ${{ vars.MARINE_GA4_MEASUREMENT_ID }}
          MARINE_GA4_ENABLED: ${{ vars.MARINE_GA4_ENABLED }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
